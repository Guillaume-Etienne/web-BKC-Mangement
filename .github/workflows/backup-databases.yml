name: Daily Database Backup & Keep Alive

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: prod
            url_secret: SUPABASE_DB_URL_PROD
            api_url_secret: SUPABASE_API_URL_PROD
            api_key_secret: SUPABASE_ANON_KEY_PROD
          - env: test
            url_secret: SUPABASE_DB_URL_TEST
            api_url_secret: SUPABASE_API_URL_TEST
            api_key_secret: SUPABASE_ANON_KEY_TEST

    steps:
      # Keep alive — ping the Supabase REST API to prevent free tier sleep
      - name: Keep alive ping (${{ matrix.env }})
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${{ secrets[matrix.api_key_secret] }}" \
            -H "Authorization: Bearer ${{ secrets[matrix.api_key_secret] }}" \
            "${{ secrets[matrix.api_url_secret] }}/rest/v1/seasons?select=id&limit=1" \
          && echo "✅ ${{ matrix.env }} is alive" \
          || echo "⚠️ ${{ matrix.env }} ping failed (may be paused)"

      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database (${{ matrix.env }})
        env:
          DATABASE_URL: ${{ secrets[matrix.url_secret] }}
        run: |
          FILENAME="backup_${{ matrix.env }}_$(date +%Y%m%d_%H%M%S).sql"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            > "$FILENAME"
          gzip "$FILENAME"
          echo "BACKUP_FILE=${FILENAME}.gz" >> $GITHUB_ENV

          # Retention tiers. Still one dump per day per database, exactly as
          # before — what changes is how long it lives. 1st of the month: kept
          # a year. Sunday: three months. Any other day: two weeks. No extra
          # copies, just a longer life for the dumps worth keeping.
          # NOTE: anything over 90 days only takes effect on a PRIVATE repo,
          # and only once Settings > Actions > General > "Artifact and log
          # retention" is raised. Otherwise GitHub clamps to the repo maximum
          # with a warning — it degrades, it does not fail.
          DOM=$(date +%d)
          DOW=$(date +%u)
          if   [ "$DOM" = "01" ]; then TIER=monthly; DAYS=365
          elif [ "$DOW" = "7"  ]; then TIER=weekly;  DAYS=90
          else                         TIER=daily;   DAYS=14
          fi
          echo "RETENTION_DAYS=$DAYS" >> $GITHUB_ENV
          echo "TIER=$TIER" >> $GITHUB_ENV

          # Real size in the job summary, so the storage budget is measured
          # instead of guessed.
          SIZE=$(du -h "${FILENAME}.gz" | cut -f1)
          echo "**${{ matrix.env }}** - tier $TIER, size **$SIZE**, kept $DAYS days" >> $GITHUB_STEP_SUMMARY

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v5
        with:
          name: backup-${{ matrix.env }}-${{ env.TIER }}-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: ${{ env.RETENTION_DAYS }}
