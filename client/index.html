<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilene Kite Center</title>
    <!-- Internal booking/ops tool and client-facing links behind signed tokens — never meant
         to be indexed or crawled for AI training. See public/robots.txt for the crawler list. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <script>
      // Applied before paint so the page never flashes the wrong theme.
      // localStorage throws (not returns null) in an in-app browser or with site
      // data blocked — see src/lib/supabase.ts. Worst case here: the system theme.
      (function () {
        var stored = null
        try { stored = localStorage.getItem('bkc_theme') } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
